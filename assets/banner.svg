<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="t d">
  <title id="t">Claude HUD</title>
  <desc id="d">Answer Claude Code from your MacBook notch</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141417"/>
      <stop offset="1" stop-color="#0D0D0F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#D96B43" stop-opacity="0.38"/>
      <stop offset="0.5" stop-color="#D96B43" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#D96B43" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F5F5F2"/>
      <stop offset="1" stop-color="#EE855A"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B1B20"/>
      <stop offset="1" stop-color="#0D0D0F"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EE855A"/>
      <stop offset="1" stop-color="#D96B43"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <ellipse cx="980" cy="150" rx="420" ry="260" fill="url(#glow)"/>

  <!-- left: wordmark + tagline + command chip -->
  <g font-family="-apple-system, 'SF Pro Display', Inter, 'Helvetica Neue', Arial, sans-serif">
    <circle cx="86" cy="96" r="7" fill="#D96B43"/>
    <circle cx="86" cy="96" r="13" fill="none" stroke="#EE855A" stroke-opacity="0.45" stroke-width="2"/>
    <text x="112" y="102" font-size="15" font-weight="600" letter-spacing="3" fill="#AEAEB5">MACOS MENU-BAR APP</text>
    <text x="80" y="178" font-size="78" font-weight="800" letter-spacing="-2" fill="url(#word)">Claude HUD</text>
    <text x="82" y="222" font-size="22" font-weight="500" fill="#F5F5F2">Answer Claude Code from your MacBook notch</text>
  </g>
  <g>
    <rect x="82" y="254" width="326" height="48" rx="12" fill="#1B1B20" stroke="#2C2C33"/>
    <text x="104" y="285" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="19" fill="#F59F26">$</text>
    <text x="126" y="285" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="19" fill="#F5F5F2">./scripts/build-app.sh</text>
  </g>

  <!-- right: MacBook screen top edge, notch, dropping card -->
  <g transform="translate(50 0)" font-family="-apple-system, 'SF Pro Display', Inter, 'Helvetica Neue', Arial, sans-serif">
    <!-- lid -->
    <path d="M640 360 V52 Q640 30 662 30 H1218 Q1240 30 1240 52 V360 Z" fill="#2A2A30"/>
    <path d="M648 360 V54 Q648 38 664 38 H1216 Q1232 38 1232 54 V360 Z" fill="url(#screen)"/>
    <!-- menu bar strip -->
    <rect x="648" y="38" width="584" height="22" fill="#000" fill-opacity="0.35"/>
    <circle cx="668" cy="49" r="3.5" fill="#AEAEB5" fill-opacity="0.6"/>
    <rect x="682" y="46" width="34" height="6" rx="3" fill="#AEAEB5" fill-opacity="0.35"/>
    <rect x="724" y="46" width="26" height="6" rx="3" fill="#AEAEB5" fill-opacity="0.25"/>
    <rect x="1150" y="46" width="22" height="6" rx="3" fill="#AEAEB5" fill-opacity="0.3"/>
    <rect x="1180" y="46" width="34" height="6" rx="3" fill="#AEAEB5" fill-opacity="0.3"/>
    <!-- card (drawn before notch so notch overlaps its top edge) -->
    <rect x="768" y="38" width="344" height="196" rx="22" fill="#141417" stroke="#EE855A" stroke-opacity="0.55" stroke-width="1.5"/>
    <rect x="768" y="38" width="344" height="196" rx="22" fill="none" stroke="#D96B43" stroke-opacity="0.25" stroke-width="6"/>
    <!-- notch -->
    <path d="M820 38 H1060 V44 Q1060 64 1040 64 H840 Q820 64 820 44 Z" fill="#000"/>
    <!-- card content -->
    <circle cx="800" cy="92" r="6" fill="#D96B43"/>
    <text x="816" y="97" font-size="15" font-weight="600" fill="#F5F5F2">Claude</text>
    <text x="1084" y="97" text-anchor="end" font-size="12" fill="#AEAEB5">1 of 2</text>
    <text x="792" y="140" font-size="20" font-weight="600" fill="#F5F5F2">Run the deploy now?</text>
    <rect x="792" y="170" width="132" height="40" rx="12" fill="url(#btn)"/>
    <text x="858" y="195" text-anchor="middle" font-size="15" font-weight="700" fill="#0D0D0F">Yes, deploy</text>
    <rect x="936" y="170" width="152" height="40" rx="12" fill="#26262C" stroke="#3A3A42"/>
    <text x="1012" y="195" text-anchor="middle" font-size="15" font-weight="600" fill="#F5F5F2">Not yet</text>
    <!-- queue layers under card -->
    <rect x="788" y="238" width="304" height="6" rx="3" fill="#D96B43" fill-opacity="0.28"/>
    <rect x="808" y="248" width="264" height="5" rx="2.5" fill="#D96B43" fill-opacity="0.15"/>
  </g>
</svg>
